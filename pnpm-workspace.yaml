minimumReleaseAgeStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Eve 0.44.4's current official scaffold resolves the matching AI SDK release cohort.
  - "@ai-sdk/*"
  - ai
  - "@vercel/*"
  - "@onkernel/*"
  - eve
  # These browser and rendering transitive releases are locked by the current Eve UI scaffold.
  - baseline-browser-mapping
  - caniuse-lite
  - electron-to-chromium
  - mermaid
  - picomatch
  - systeminformation
allowBuilds:
  cbor-extract: false
  esbuild: true
  sharp: true

# Security backports kept within each dependency's installed major.
overrides:
  dompurify: 3.4.17
  proxy-addr: 2.0.8
  tinypool: 2.1.2
  tar@7: 7.5.22
  zod@4: 4.6.6
  "@modelcontextprotocol/sdk": 1.32.2
  "@tootallnate/once@2": 2.0.1
  ajv@8: 8.20.0
  body-parser@2: 2.4.0
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  brace-expansion@5: 5.0.12
  fast-uri@3: 3.1.9
  hono@4: 4.13.14
  ip-address@10: 10.7.5
  js-yaml@4: 4.3.2
  minimatch@10: 10.2.6
  path-to-regexp@6: 6.3.0
  path-to-regexp@8: 8.4.2
  postcss-selector-parser@7: 7.1.7
  qs@6: 6.16.1
  smol-toml@1: 1.9.1
  source-map-js@1: 1.2.2
  undici@6: 6.29.1
  undici@7: 7.30.1
  undici@8: 8.12.3
  vite@8: 8.2.4
